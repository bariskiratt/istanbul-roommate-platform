# AWS tarafının PR kontrolleri: Terraform ve Lambda imajı. AWS hesabı GEREKMEZ.
#
#   terraform  fmt + validate (state'e ve AWS'ye dokunmaz)
#   lambda     servis testleri; modeli eğitir, imajı derler, Lambda'nın kendi
#              çalışma zamanı öykünücüsüyle (RIE) ayağa kaldırır ve 200 ilanda
#              backend'in yerel modeliyle AYNI bandı verdiğini sınar (eşlik testi).
#
# Yalnızca PR'da ve yalnızca ilgili dosyalar değişince koşar. main'de koşmaz:
# Render backend'i commit'teki TÜM kontroller bitince yayına alıyor
# (render.yaml: checksPass); PR'da geçmiş bir sınamayı main'de tekrarlamak
# her backend yayınını birkaç dakika bekletirdi. main'deki gerçek dağıtım ve
# duman testi aws-deploy.yml'de.
name: AWS kontrolleri

on:
  pull_request:
    paths:
      - infra/**
      - services/fairprice/**
      - backend/app/__init__.py
      - backend/app/config.py
      - backend/app/pricing.py
      - backend/scripts/train_model.py
      - backend/requirements.txt
      - .github/workflows/aws-checks.yml
      - .github/workflows/aws-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  lambda:
    name: Lambda imajı ve eşlik testi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # Modeli eğiten ve eşlik testinde yerel tarafı hesaplayan Python,
      # backend'inkiyle aynı sabit sürümler (backend/requirements.txt).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-test.txt

      - name: Servis testleri
        run: python -m pytest -q services/fairprice/tests

      - name: Modeli eğit
        working-directory: backend
        run: python -m scripts.train_model --fast

      # --provenance=false: Lambda, BuildKit'in eklediği tanıklık (attestation)
      # manifestli imaj dizinlerini kabul etmiyor.
      - name: İmajı derle
        run: |
          docker build --provenance=false --platform linux/amd64 \
            -f services/fairprice/Dockerfile -t fairprice:ci .
          size=$(docker image inspect fairprice:ci --format '{{.Size}}')
          echo "Lambda imajı: $((size / 1024 / 1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lambda öykünücüsüyle çalıştır
        run: |
          docker run -d --name fairprice -p 9000:8080 \
            -e MODEL_PATH=/opt/model/fair_price_model.joblib \
            -e MODEL_VERSION=ci \
            -v "$PWD/backend/models:/opt/model:ro" \
            fairprice:ci

      - name: Eşlik testi (200 ilan, yerel model = Lambda)
        run: |
          python services/fairprice/parity_check.py \
            --model backend/models/fair_price_model.joblib \
            --endpoint http://localhost:9000/2015-03-31/functions/function/invocations \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Duman testi (dağıtımdakiyle aynı olay)
        run: |
          curl -sf -X POST -d @services/fairprice/smoke-event.json \
            http://localhost:9000/2015-03-31/functions/function/invocations > smoke.json
          python services/fairprice/smoke_check.py smoke.json ci

      - name: Konteyner logları
        if: failure()
        run: docker logs fairprice
