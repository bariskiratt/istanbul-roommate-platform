# AWS yayını: kira modelini eğitip S3'e koyar, Lambda tahmin servisini dağıtır.
#
# Ne zaman koşar:
#   - CI main'de yeşil bitince. Yalnızca ilgili dosyalar değiştiyse iş yapar:
#       model verisi/kodu  → eğit, kalite kapısı, S3 (+ yeni modelle Lambda)
#       servis kodu        → Lambda imajını derle ve dağıt
#   - Elle: Actions → AWS yayını → Run workflow (ilk kurulumda iki kutu da açık).
#
# AWS'ye anahtarla değil OIDC ile girer: GitHub'da saklanan tek şey rolün
# ARN'si (Settings → Secrets and variables → Actions → Variables →
# AWS_ROLE_ARN), o da gizli değil. Değişken tanımlı değilse hiçbir iş koşmaz;
# AWS kurulmadan bu dosya main'e girebilir. Rolü yalnızca main dalındaki
# koşular üstlenebilir (infra/github.tf). Kurulum: docs/AWS.md.
#
# Dağıtım güvenliği: yeni Lambda sürümü önce yayınlanır, `live` takma adı
# ancak o sürüme yapılan duman testi geçerse ona çevrilir. Test düşerse
# kullanıcı trafiği eski sürümde kalır ve bu iş kırmızı biter.
#
# Not: render.yaml'daki checksPass commit'teki kontrolleri bekler ve bu iş
# akışının işleri de main commit'inde kontrol olarak görünür (frontend-deploy.yml
# ile aynı durum). Yani kırmızı biten bir model/servis yayını o commit'in
# backend yayınını da durdurabilir. Kabul edilebilir: bu iş akışı yalnızca
# model ya da servis dosyaları değişince iş yapar, diğer commit'lerde atlanır
# (atlanan iş Render'ı bekletmez); hiçbir adımı Render'ı beklemez.
name: AWS yayını

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      train:
        description: Modeli yeniden eğit ve kalite kapısından geçirip S3'e koy
        type: boolean
        default: false
      deploy:
        description: Lambda imajını derle ve dağıt (S3'teki yayındaki modelle)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC belirteci (AWS rolü için)

# Yayınlar sırayla: iki koşu aynı anda latest.json'a ya da `live`a yazmasın.
concurrency:
  group: aws-release
  cancel-in-progress: false

env:
  # infra/variables.tf ve infra/versions.tf'teki adlandırmayla aynı.
  AWS_REGION: us-west-2
  FUNCTION: evdes-fairprice
  ECR_REPOSITORY: evdes-fairprice

jobs:
  plan:
    name: Ne yayınlanacak
    if: >-
      vars.AWS_ROLE_ARN != '' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      train: ${{ steps.plan.outputs.train }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TRAIN: ${{ inputs.train }}
          INPUT_DEPLOY: ${{ inputs.deploy }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            train=$INPUT_TRAIN
            deploy=$INPUT_DEPLOY
          else
            # PR birleştirmesinin getirdiği dosyalar (birinci ebeveyne göre).
            changed=$(git diff --name-only HEAD^1 HEAD)
            train=false
            deploy=false
            if grep -qE '^backend/(scripts/train_model\.py|app/(pricing|config)\.py|data/raw/istanbulApartmentForRent\.csv|requirements\.txt)$' <<<"$changed"; then
              train=true
            fi
            if grep -qE '^(services/fairprice/|backend/app/(__init__|config|pricing)\.py$)' <<<"$changed"; then
              deploy=true
            fi
          fi
          echo "train=$train" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Eğitim: $train · Lambda dağıtımı: $deploy" | tee -a "$GITHUB_STEP_SUMMARY"

  train:
    name: Modeli eğit ve S3'e koy
    needs: plan
    if: needs.plan.outputs.train == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      promoted: ${{ steps.publish.outputs.promoted }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Backend ve Lambda ile aynı sabit sürümler: model pickle'ı ikisinde de açılsın.
      - run: pip install -r requirements.txt
      - id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: python -m scripts.train_model --fast
      - id: publish
        env:
          BUCKET: evdes-models-${{ steps.aws.outputs.aws-account-id }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          version="$(date -u +%Y%m%d-%H%M%S)-${SHA::7}"
          python -m scripts.publish_model --bucket "$BUCKET" --version "$version" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Lambda'yı dağıt
    needs: [plan, train]
    # train atlandıysa da koşar; train düştüyse (kapı reddetti) koşmaz.
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.train.result != 'failure' && needs.train.result != 'cancelled' &&
      (needs.plan.outputs.deploy == 'true' || needs.train.outputs.promoted == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Yayındaki modeli bul
        env:
          BUCKET: evdes-models-${{ steps.aws.outputs.aws-account-id }}
        run: |
          if ! aws s3 cp "s3://$BUCKET/fair-price/latest.json" latest.json; then
            echo "::error::S3'te yayında model yok. Önce 'AWS yayını' iş akışını 'Modeli yeniden eğit' açık çalıştır."
            exit 1
          fi
          echo "MODEL_VERSION=$(jq -r .version latest.json)" >> "$GITHUB_ENV"
          echo "MODEL_SHA256=$(jq -r .sha256 latest.json)" >> "$GITHUB_ENV"

      - name: İmajı derle ve ECR'ye gönder
        env:
          ACCOUNT: ${{ steps.aws.outputs.aws-account-id }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          registry="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          # ECR etiketleri değiştirilemez (infra/service.tf): her koşu yeni etiket.
          tag="${SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --provenance=false --platform linux/amd64 \
            --build-arg MODEL_VERSION="$MODEL_VERSION" \
            --build-arg MODEL_SHA256="$MODEL_SHA256" \
            -f services/fairprice/Dockerfile -t "$registry/$ECR_REPOSITORY:$tag" .
          docker push "$registry/$ECR_REPOSITORY:$tag"
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)
          echo "IMAGE_URI=$registry/$ECR_REPOSITORY@$digest" >> "$GITHUB_ENV"

      - name: Lambda var mı
        id: exists
        run: |
          if err=$(aws lambda get-function --function-name "$FUNCTION" 2>&1 >/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ResourceNotFoundException <<<"$err"; then
            # İlk kurulum: Terraform fonksiyonu bu imajla kuracak (docs/AWS.md adım 6).
            echo "::notice::İmaj ECR'de. Lambda henüz yok: infra/terraform.tfvars'ta enable_predict_service = true yapıp terraform apply çalıştır."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$err"
            exit 1
          fi

      - name: Yeni sürümü yayınla
        if: steps.exists.outputs.exists == 'true'
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" \
            --image-uri "$IMAGE_URI" > /dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          version=$(aws lambda publish-version --function-name "$FUNCTION" \
            --description "git ${SHA::7} · model $MODEL_VERSION" \
            --query Version --output text)
          aws lambda wait function-active-v2 --function-name "$FUNCTION" --qualifier "$version"
          echo "NEW_VERSION=$version" >> "$GITHUB_ENV"

      - name: Duman testi (yeni sürüm, trafik almadan)
        if: steps.exists.outputs.exists == 'true'
        run: |
          aws lambda invoke --function-name "$FUNCTION" --qualifier "$NEW_VERSION" \
            --payload fileb://services/fairprice/smoke-event.json smoke.json > /dev/null
          python3 services/fairprice/smoke_check.py smoke.json "$MODEL_VERSION"

      - name: Trafiği yeni sürüme çevir
        if: steps.exists.outputs.exists == 'true'
        run: |
          previous=$(aws lambda get-alias --function-name "$FUNCTION" --name live \
            --query FunctionVersion --output text)
          aws lambda update-alias --function-name "$FUNCTION" --name live \
            --function-version "$NEW_VERSION" > /dev/null
          # Isıtıcıyı beklemeden yeni sürümün bir ortamını ısıt.
          echo '{"warmup": true}' > warmup.json
          aws lambda invoke --function-name "$FUNCTION" --qualifier live \
            --payload fileb://warmup.json warm.json > /dev/null
          {
            echo "### Lambda \`live\`: sürüm $previous → $NEW_VERSION"
            echo "- Model: \`$MODEL_VERSION\`"
            echo "- İmaj: \`$IMAGE_URI\`"
            echo "- Geri almak için: \`aws lambda update-alias --function-name $FUNCTION --name live --function-version $previous\`"
          } >> "$GITHUB_STEP_SUMMARY"
