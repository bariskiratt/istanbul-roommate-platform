# Render ücretsiz planı 15 dk hareketsizlikte uyur; bu iş 10 dakikada bir
# API'ye dokunarak servisi uyanık tutar. (GitHub, 60 gün commit olmayan
# depolarda zamanlanmış işleri durdurur — Actions sekmesinden tekrar açılır.)
name: keep-render-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl -fsS --max-time 90 https://api.evdes.tr/ > /dev/null || true
