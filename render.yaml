# Render blueprint — repo'yu Render'a bağlayınca bu dosya otomatik kurulum yapar.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: roommatch-api
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: CORS_ORIGINS
        sync: false        # Vercel adresini elle gir (ör. https://roommatch.vercel.app)
      - key: DEV_OTP
        value: "1"         # E-posta servisi bağlanana kadar 1 kalmalı; bağlanınca 0 yap
      - key: DATABASE_URL
        fromDatabase:
          name: roommatch-db
          property: connectionString

databases:
  - name: roommatch-db
    plan: free
