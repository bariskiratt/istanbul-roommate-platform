# Render blueprint — repo'yu Render'a bağlayınca bu dosya otomatik kurulum yapar.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: roommatch-api
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: CORS_ORIGINS
        sync: false        # Vercel adresini elle gir (ör. https://roommatch.vercel.app)
      # GÜVENLİ TARAF: blueprint bu değeri açıkça 0 yazar.
      # DEV_OTP=1 iken /auth/request-otp doğrulama kodunu API YANITINDA döndürür.
      # Bu repoda yönetici e-postaları açıkça yazılı (app/config.py ADMIN_EMAILS)
      # olduğu için, temiz bir dağıtımda değer 1 kalırsa herkes o adresle kod
      # isteyip şifresiz yönetici olabilir. Eskiden burada `sync: false` vardı;
      # değer panelde boş bırakılırsa auth.py'nin varsayılanı ("1") devreye
      # giriyordu — yani unutmanın cezası açık bir yönetici paneliydi.
      # 0 iken e-posta gönderilemezse kayıt/giriş 502 ile GÖRÜNÜR biçimde
      # başarısız olur; sessizce güvensiz kalmaz. Önce BREVO_API_KEY + EMAIL_FROM.
      # NOT: değer blueprint'e yazılı olduğu için sonraki blueprint eşitlemeleri
      # panelden yapılan elle değişikliği geri alabilir. Bir dağıtımda gerçekten
      # dev modu gerekiyorsa değeri burada değiştir. Doğrulama: DEPLOY.md §1.3.
      - key: DEV_OTP
        value: "0"
      # Mesajların veritabanında AES-256-GCM ile şifrelenmesi için gereken anahtar.
      # Tanımlı değilse (ya da biçimi bozuksa) app/crypto.py sessizce DÜZ METİN
      # yazmaya döner — bu yüzden bu değişkenin üretimde dolu olması şart.
      # Render değeri bir kez üretip kalıcı saklar; SONRAKİ DAĞITIMLARDA DEĞİŞMEZ.
      # UYARI: anahtar kaybolur ya da değişirse onunla şifrelenmiş TÜM mesajlar
      # kalıcı olarak okunamaz hale gelir. İlk dağıtımdan sonra panelden kopyalayıp
      # yedekle. Beklenen biçim: base64(32 bayt). Render'ın ürettiği değer bu
      # biçimde değilse elle üret (python -m app.crypto --genkey) ve panele yapıştır.
      # Doğrulama adımları: DEPLOY.md.
      - key: MESSAGE_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: roommatch-db
          property: connectionString

databases:
  - name: roommatch-db
    plan: free
