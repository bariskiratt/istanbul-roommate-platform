<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı — evdes.tr</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.png" type="image/png">
<style>
:root{color-scheme:light dark;--fg:#1c1914;--muted:#6b6459;--bg:#faf7f2;--accent:#3f2d63}
@media(prefers-color-scheme:dark){:root{--fg:#ece5da;--muted:#a39a8d;--bg:#141210;--accent:#b9a3e8}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:1.5rem}
h1{font-size:3rem;margin:0}
p{color:var(--muted);max-width:26rem}
a{color:var(--accent)}
.cta{display:inline-block;margin-top:1rem;padding:.8rem 1.4rem;border-radius:999px;
  background:var(--fg);color:var(--bg);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div>
<h1>404</h1>
<p>Aradığın sayfa bulunamadı. Adres yanlış yazılmış olabilir ya da sayfa kaldırılmış olabilir.</p>
<p><a class="cta" href="/">Ana sayfaya dön</a></p>
<p style="margin-top:2rem"><a href="/semt/">İstanbul semtlerinde oda kiraları</a></p>
</div>
</body>
</html>
