<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İstanbul'da ev arkadaşı ve kiralık oda bul — evdes.tr</title>
    <meta name="theme-color" content="#ffffff" />

    <!-- Sekme ikonu. SVG önce gelir (her boyutta net); SVG desteklemeyen eski
         tarayıcılar PNG'ye düşer. favicon.ico ise link etiketi hiç okunmadan
         istenen adres, dosya orada durmazsa her ilk yüklemede 404 üretir.
         ?v= sürümü, ikon değişince artırılır: tarayıcılar sekme ikonunu
         sayfadan ayrı ve uzun süre saklar, aynı adreste yeni ikonu görmez.
         apple-touch-icon ve manifest, siteyi telefonun ana ekranına
         ekleyenlerin göreceği ikon. -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png?v=2" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="description" content="İstanbul'daki üniversite öğrencileri için ev arkadaşı ve oda ilanları: okul e-postasıyla doğrulanmış öğrenciler, adil kira hesabı ve semt semt bütçe haritası." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="İstanbul'da ev arkadaşı ve kiralık oda bul — evdes.tr" />
    <meta property="og:site_name" content="evdes.tr" />
    <meta property="og:description" content="İstanbul'daki üniversite öğrencileri için ev arkadaşı ve oda ilanları: okul e-postasıyla doğrulanmış öğrenciler, adil kira hesabı ve semt semt bütçe haritası." />
    <meta property="og:url" content="https://evdes.tr/" />
    <meta property="og:locale" content="tr_TR" />

    <!-- Paylaşım görseli. Mutlak adres şart: WhatsApp/X göreli yolu çözemez.
         Kaynağı scripts/og-image.svg, üretme komutu o dosyanın içinde. -->
    <meta property="og:image" content="https://evdes.tr/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="evdes.tr — İstanbul'da ev arkadaşı bul" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://evdes.tr/og.jpg" />
    <!-- Başlık, açıklama, canonical ve og:* derlemede arama motoruna açık her
         rota için yeniden yazılır (scripts/route-heads.ts); metinler
         src/i18n/translations.ts'teki "meta.*" anahtarlarından gelir. -->
    <link rel="canonical" href="https://evdes.tr/" />

    <!-- Google'ın arama sonucunda adresin üstünde gösterdiği site adı ve
         logo. Ad bilerek "evdes.tr": yalnız "evdes" Enerji Bakanlığı'nın
         EVDES sistemiyle çakışıyor (bkz. src/lib/brand.ts). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://evdes.tr/#website",
            "name": "evdes.tr",
            "url": "https://evdes.tr/",
            "inLanguage": "tr-TR",
            "publisher": { "@id": "https://evdes.tr/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://evdes.tr/#organization",
            "name": "evdes.tr",
            "url": "https://evdes.tr/",
            "logo": "https://evdes.tr/icon-512.png"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
