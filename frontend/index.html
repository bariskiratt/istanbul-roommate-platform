<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>evdes.tr — İstanbul'da ev arkadaşı bul</title>
    <meta name="theme-color" content="#ffffff" />

    <!-- Sekme ikonu. SVG önce gelir (her boyutta net); SVG desteklemeyen eski
         tarayıcılar PNG'ye düşer. favicon.ico ise link etiketi hiç okunmadan
         istenen adres, dosya orada durmazsa her ilk yüklemede 404 üretir.
         ?v= sürümü, ikon değişince artırılır: tarayıcılar sekme ikonunu
         sayfadan ayrı ve uzun süre saklar, aynı adreste yeni ikonu görmez.
         apple-touch-icon ve manifest, siteyi telefonun ana ekranına
         ekleyenlerin göreceği ikon. -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png?v=2" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="description" content="Üniversite öğrencilerine özel ev arkadaşı bulma platformu: adil kira danışmanı, bütçe haritası ve eşleşme." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="evdes.tr — İstanbul'da ev arkadaşı bul" />
    <meta property="og:site_name" content="evdes.tr" />
    <meta property="og:description" content="Üniversite öğrencilerine özel ev arkadaşı bulma platformu: adil kira danışmanı, bütçe haritası ve eşleşme." />
    <meta property="og:url" content="https://evdes.tr/" />
    <meta property="og:locale" content="tr_TR" />

    <!-- Paylaşım görseli. Mutlak adres şart: WhatsApp/X göreli yolu çözemez.
         Kaynağı scripts/og-image.svg, üretme komutu o dosyanın içinde. -->
    <meta property="og:image" content="https://evdes.tr/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="evdes.tr — İstanbul'da ev arkadaşı bul" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://evdes.tr/og.jpg" />
    <link rel="canonical" href="https://evdes.tr/" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
