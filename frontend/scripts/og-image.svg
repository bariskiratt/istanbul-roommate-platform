<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Sosyal paylaşım görselinin KAYNAĞI. public/og.jpg bundan üretilir:

         "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
           --headless --disable-gpu --hide-scrollbars \
           --screenshot=shot.png --window-size=1200,630 \
           "file://$PWD/scripts/og-image.svg"
         sips -s format jpeg -s formatOptions 82 shot.png --out public/og.jpg

       Paylaşım görselini değiştirmek isteyen burayı düzenlesin; jpg elle
       boyanmış bir dosya değil.

       Not: qlmanage bu işe yaramıyor, SVG'yi kareye sığdırıp taşırıyor.
       Chrome pencere ölçüsünü birebir uyguluyor.

       Ölçü 1200x630 (1.91:1): WhatsApp, X ve Facebook'un beklediği oran.
       JPEG tercih edildi çünkü PNG 279 KB'a çıkıyor ve WhatsApp büyük
       önizleme görsellerini çekmeyi bırakıyor; jpeg 65 KB, gözle fark yok. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1512"/>
      <stop offset="100%" stop-color="#2E1F45"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Marka işareti: favicon ile aynı yuvarlatılmış kare + ev ikonu -->
  <g transform="translate(96 150)">
    <rect width="104" height="104" rx="24" fill="#4E307E"/>
    <g transform="translate(20 20) scale(2.75)" fill="none" stroke="#FFFFFF"
       stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <path d="M9 22V12h6v10"/>
    </g>
  </g>

  <text x="232" y="228" font-family="Georgia, 'Times New Roman', serif"
        font-size="86" font-weight="700" fill="#F5EFE8">evdes.tr</text>

  <text x="96" y="360" font-family="Georgia, 'Times New Roman', serif"
        font-size="60" font-weight="700" fill="#F5EFE8">İstanbul'da ev arkadaşı bul</text>

  <text x="96" y="428" font-family="Helvetica, Arial, sans-serif"
        font-size="34" fill="#C9BCAE">Üniversite öğrencilerine özel eşleşme,</text>
  <text x="96" y="474" font-family="Helvetica, Arial, sans-serif"
        font-size="34" fill="#C9BCAE">adil kira danışmanı ve bütçe haritası</text>

  <rect x="96" y="528" width="150" height="6" rx="3" fill="#4E307E"/>
</svg>
