<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Sosyal paylaşım görselinin KAYNAĞI. public/og.jpg bundan üretilir:
       sh scripts/og-image.sh (komutlar orada; XML yorumu çift tire
       taşıyamadığı için Chrome bayrakları buraya yazılamıyor, yazılınca
       Chrome dosyayı hiç çizmiyor).

       Yazı tipleri Google Fonts'tan yüklenir; virtual-time-budget Chrome'un
       onları bekleyip öyle çekmesi için. İnternetsiz üretilirse Georgia ve
       Helvetica'ya düşer, görsel bozulmaz ama site gibi görünmez.

       Paylaşım görselini değiştirmek isteyen burayı düzenlesin; jpg elle
       boyanmış bir dosya değil.

       Ölçü 1200x630 (1.91:1): WhatsApp, X ve Facebook'un beklediği oran.
       JPEG tercih edildi çünkü PNG büyüyor ve WhatsApp büyük önizleme
       görsellerini çekmeyi bırakıyor.

       Görsel sitenin kendisi gibi: çizgili defter sayfası, fosforlu kalemle
       işaretlenmiş logo ve sağda mühürlü boş öğrenci kartı. Renkler
       src/index.css'teki açık tema değerleri. -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&amp;family=Schibsted+Grotesk:wght@400;600;700&amp;display=block');
      .serif { font-family: 'Newsreader', Georgia, 'Times New Roman', serif; font-weight: 600; }
      .sans { font-family: 'Schibsted Grotesk', Helvetica, Arial, sans-serif; }
    </style>
    <!-- Defter çizgileri -->
    <pattern id="rules" width="1200" height="42" patternUnits="userSpaceOnUse" y="20">
      <rect width="1200" height="1.5" y="40.5" fill="#c6dbf6"/>
    </pattern>
    <clipPath id="card">
      <rect width="300" height="392" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#rules)"/>
  <!-- Kenar boşluğu çizgisi -->
  <rect x="84" width="2" height="630" fill="#f7a1a5"/>

  <!-- Logo: "evdes" fosforlu kalemle işaretli, ".tr" düz -->
  <g transform="translate(120 132)">
    <path d="M-6 -36 L176 -42 L180 8 L-2 12 Z" fill="#ffe83d"/>
    <text class="serif" x="0" y="0" font-size="60" fill="#151a33">evdes<tspan>.tr</tspan></text>
  </g>

  <text class="serif" x="120" y="296" font-size="72" fill="#151a33">Doğru ev arkadaşı,</text>
  <text class="serif" x="120" y="376" font-size="72" fill="#151a33">adil bir kirayla.</text>

  <text class="sans" x="120" y="456" font-size="28" fill="#5a5f72">İstanbul'daki üniversite öğrencileri için eşleşme,</text>
  <text class="sans" x="120" y="496" font-size="28" fill="#5a5f72">adil kira danışmanı ve bütçe haritası.</text>

  <!-- Öğrenci kartı: sitenin akılda kalan parçası -->
  <g transform="translate(820 118) rotate(-3 150 196)">
    <rect width="300" height="392" rx="16" fill="#ffffff"/>
    <g clip-path="url(#card)">
      <rect width="300" height="46" fill="#151a33"/>
    </g>
    <rect width="300" height="392" rx="16" fill="none" stroke="#dadde7" stroke-width="2"/>
    <text class="sans" x="20" y="29" font-size="16" font-weight="600" fill="#ffffff">Senin üniversiten</text>
    <text class="serif" x="280" y="29" font-size="17" fill="#ffffff" fill-opacity="0.8" text-anchor="end">evdes.tr</text>

    <rect x="20" y="66" width="96" height="128" rx="8" fill="#f2f3f8" stroke="#dadde7" stroke-width="1.5"/>
    <text class="serif" x="68" y="144" font-size="44" fill="#5a5f72" fill-opacity="0.5" text-anchor="middle">?</text>

    <text class="serif" x="134" y="98" font-size="30" fill="#5a5f72" fill-opacity="0.6">Adın</text>
    <text class="sans" x="134" y="128" font-size="16" fill="#5a5f72" fill-opacity="0.6">Bölümün</text>
    <text class="sans" x="134" y="150" font-size="16" fill="#5a5f72" fill-opacity="0.6">Kaçıncı sınıf</text>

    <!-- Barkod -->
    <g fill="#151a33" fill-opacity="0.8" transform="translate(20 222)">
      <rect x="0" width="3" height="22"/><rect x="6" width="2" height="22"/><rect x="11" width="4" height="22"/>
      <rect x="18" width="2" height="22"/><rect x="23" width="3" height="22"/><rect x="29" width="2" height="22"/>
      <rect x="34" width="4" height="22"/><rect x="41" width="2" height="22"/><rect x="46" width="3" height="22"/>
      <rect x="52" width="2" height="22"/><rect x="57" width="4" height="22"/><rect x="64" width="2" height="22"/>
      <rect x="69" width="3" height="22"/><rect x="75" width="2" height="22"/><rect x="80" width="4" height="22"/>
      <rect x="87" width="2" height="22"/><rect x="92" width="3" height="22"/><rect x="98" width="4" height="22"/>
      <rect x="105" width="2" height="22"/><rect x="110" width="3" height="22"/><rect x="116" width="2" height="22"/>
    </g>

    <!-- Mühür: doğrulandı, .edu.tr ile -->
    <g transform="translate(112 304) rotate(-9)" fill="none" stroke="#264bc5" opacity="0.88">
      <rect x="0" y="0" width="160" height="62" rx="7" stroke-width="3"/>
      <rect x="-5" y="-5" width="170" height="72" rx="10" stroke-width="1.5"/>
      <text class="sans" x="80" y="29" font-size="19" font-weight="700" fill="#264bc5" stroke="none" text-anchor="middle" letter-spacing="1">DOĞRULANDI</text>
      <text class="sans" x="80" y="50" font-size="15" font-weight="600" fill="#264bc5" stroke="none" text-anchor="middle">.edu.tr ile</text>
    </g>
  </g>
</svg>
